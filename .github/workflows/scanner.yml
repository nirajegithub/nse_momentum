name: NSE Momentum Scanner V1

on:
  workflow_dispatch:
    inputs:
      action:
        description: "universe, scan, monitor or summary"
        required: true
        type: choice
        options: [universe, scan, monitor, summary]

permissions:
  contents: write

concurrency:
  group: nse-momentum-scanner
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    env:
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DRY_RUN: "true"
      MIN_PRICE: "250"
      MIN_PREV_VOLUME: "500000"
      SCANNER_ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run scanner
        run: python -m app.main
      - name: Persist same-day state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/runtime_state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update momentum runtime state"
          git push
