name: NSE Momentum - Daily Summary

on:
  schedule:
    # 15:25 IST = 09:55 UTC.
    - cron: "55 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nse-momentum-summary
  cancel-in-progress: false

jobs:
  summary:
    name: NSE Momentum Point Summary
    runs-on: ubuntu-latest
    env:
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DRY_RUN: "false"
      MIN_PRICE: "350"
      MIN_PREV_VOLUME: "500000"
      MIN_DAILY_VOLUME: "500000"
      ENTRY_TIMEFRAME: "5"
      SETUP_TIMEFRAME: "15"
      SCANNER_ACTION: "summary"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send point-based summary
        run: python -m app.main

      - name: Commit cleared state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/runtime_state.json
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Clear NSE momentum daily state"
            git push
          fi
