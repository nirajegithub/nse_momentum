name: Telegram Handshake Test

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Get Telegram destination
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          url = f"https://api.telegram.org/bot{token}/getChat"

          response = requests.get(
              url,
              params={"chat_id": chat_id},
              timeout=15
          )

          print("HTTP status:", response.status_code)
          print("Telegram getChat response:")
          print(response.text)

          response.raise_for_status()

          result = response.json()

          if not result.get("ok"):
              raise RuntimeError(
                  f"Telegram getChat failed: {result}"
              )

          chat = result["result"]

          print("")
          print("===== TELEGRAM DESTINATION =====")
          print("Chat ID:", chat.get("id"))
          print("Title:", chat.get("title"))
          print("Username:", chat.get("username"))
          print("Type:", chat.get("type"))
          print("================================")

      - name: Send Telegram handshake
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          message = """🤝 <b>Telegram Handshake Test</b>

          ✅ GitHub Actions → Telegram connection is working.

          📌 Chat ID: configured
          🕒 Test: Successful

          This is a test message only.
          No NSE data or trading alert was generated."""

          response = requests.post(
              url,
              json={
                  "chat_id": chat_id,
                  "text": message,
                  "parse_mode": "HTML"
              },
              timeout=15
          )

          print("HTTP status:", response.status_code)
          print("Telegram response:", response.text)

          response.raise_for_status()

          result = response.json()

          if not result.get("ok"):
              raise RuntimeError(
                  f"Telegram API returned failure: {result}"
              )

          print("Telegram handshake successful.")
          PY
