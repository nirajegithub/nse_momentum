name: NSE Momentum - 5M Scanner

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nse-momentum-scanner
  cancel-in-progress: false

jobs:
  scanner:
    name: Scan NSE Momentum on Completed 5M Candles
    runs-on: ubuntu-latest
    env:
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DRY_RUN: "false"
      MIN_PRICE: "350"
      MIN_PREV_VOLUME: "500000"
      MIN_DAILY_VOLUME: "500000"
      BUY_RSI_MIN: "55"
      BUY_RSI_MAX: "70"
      SELL_RSI_MIN: "30"
      SELL_RSI_MAX: "45"
      RVOL_LOOKBACK: "20"
      MIN_15M_RVOL: "1.5"
      REQUIRE_EMA_CROSSOVER: "false"
      MIN_TRADE_SCORE: "5"
      MAX_TRADE_SCORE: "7"
      T1_RR: "2.0"
      T2_RR: "3.0"
      T3_RR: "4.0"
      MIN_RR: "2.0"
      MIN_STOP_DISTANCE_PERCENT: "0.50"
      RISK_PERCENT: "1.0"
      PENDING_SETUP_MAX_15M_CANDLES: "1"
      ENTRY_TIMEFRAME: "5"
      SETUP_TIMEFRAME: "15"
      SCAN_START_HHMM: "930"
      SCAN_END_HHMM: "1505"
      SCANNER_ACTION: "scan"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run completed-5M scanner
        run: python -m app.main

      - name: Commit scanner state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/runtime_state.json
          if git diff --cached --quiet; then
            echo "No scanner state changes."
          else
            git commit -m "Update NSE momentum scanner state"
            git push
          fi
