name: Dhan Token Management

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhan-token-management
  cancel-in-progress: false

jobs:
  token-management:

    name: Generate and Validate Dhan Token

    runs-on: ubuntu-latest

    env:

      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}

      DHAN_PIN: ${{ secrets.DHAN_PIN }}

      DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}

      GH_SECRET_UPDATE_TOKEN: ${{ secrets.GH_SECRET_UPDATE_TOKEN }}

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      TELEGRAM_TOKEN_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_TOKEN_ALERT_CHAT_ID }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyotp pynacl

      - name: Generate, update and validate Dhan token
        run: |
          python scripts/dhan_token_manager.py
