name: NSE Momentum - Universe Refresh

on:
  schedule:
    # 09:22 IST = 03:52 UTC. Fresh universe for the new trading day.
    - cron: "52 3 * * 1-5"
    # 09:30–14:45 IST every 15 minutes = 04:00–09:15 UTC.
    - cron: "*/15 4-8 * * 1-5"
    - cron: "0,15,30 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nse-momentum-state
  cancel-in-progress: false

jobs:
  universe:
    name: Build / Refresh NSE Universe
    runs-on: ubuntu-latest
    env:
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DRY_RUN: "false"
      MIN_PRICE: "350"
      MIN_PREV_VOLUME: "500000"
      MIN_DAILY_VOLUME: "500000"
      SCANNER_ACTION: "universe_refresh"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create or append universe
        run: python -m app.main

      - name: Commit universe state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/runtime_state.json
          if git diff --cached --quiet; then
            echo "No universe state changes."
          else
            git commit -m "Refresh NSE momentum universe"
            git push
          fi
